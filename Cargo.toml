[workspace]
resolver = "3"
members = ["crates/proto", "crates/secure", "crates/core", "crates/server", "crates/client", "crates/cli", "crates/service", "apps/tessera/src-tauri", "apps/tessera/src-tauri/plugins/background"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KC-ctrl095/Tessera"
rust-version = "1.88"

[workspace.dependencies]
tessera-proto = { path = "crates/proto" }
tessera-secure = { path = "crates/secure" }
tessera-core = { path = "crates/core" }
tessera-server = { path = "crates/server" }
tessera-client = { path = "crates/client" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "net"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# deadlock_detection: the server's watchdog names deadlocked locks (crates/cli/src/watchdog.rs).
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
url = "2"
dirs = "6"
toml = "0.9"
regex = "1"
globset = "0.4"
ignore = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
# The server's own accept loop (connection caps, header timeouts); all three
# are in the tree through axum already.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
ts-rs = { version = "11", features = ["serde-json-impl"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Security: Android must not inject Tauri's IPC bridge into iframes
# (see vendor/README.md).
[patch.crates-io]
wry = { path = "vendor/wry" }
