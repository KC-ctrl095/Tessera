# Checks for every push and pull request: formatting, lints and tests of the
# Rust workspace, the web UI's types and build, and the installer.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    # 22.04: unprivileged user namespaces, which the command sandbox's tests
    # use, are allowed there (24.04 restricts them through AppArmor).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # The browser tests use Chrome for Testing, which install.sh gives Linux
      # users: the runner's Chromium doesn't start, and its Google Chrome and
      # Edge make their own network calls.
      - name: Chrome for Testing
        run: |
          sudo rm -f /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/microsoft-edge /usr/bin/microsoft-edge-stable
          npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tee "$RUNNER_TEMP/cft.txt"
          mkdir -p ~/.local/share/tessera-browser
          ln -sf "$(tail -n 1 "$RUNNER_TEMP/cft.txt" | cut -d' ' -f2)" ~/.local/share/tessera-browser/chrome
          ~/.local/share/tessera-browser/chrome --version
      - run: cargo fmt --all --check
      # The desktop and Android app crates need GTK; they build in release.yml.
      - run: cargo clippy --locked --workspace --exclude tessera-app --exclude tessera-background --all-targets -- -D warnings
      # Failing tests also become error notes: those can be read without signing in.
      - name: Tests
        shell: bash
        run: |
          set +e
          # Two tests look at every process on the machine: they run alone
          # afterwards, so other tests' sandboxed processes don't count.
          whole_machine="killing_a_job_stops_its_whole_tree observe_scans_proc_once_and_skips_held_marker_reads claude_close_stops_spawn_owned_setsid_descendant"
          skips=$(for t in $whole_machine; do printf -- '--skip %s ' "$t"; done)
          cargo test --locked --workspace --exclude tessera-app --exclude tessera-background --no-fail-fast -- $skips > "$RUNNER_TEMP/test.log" 2>&1
          status=$?
          cargo test --locked -p tessera-core --lib -- --test-threads=1 $whole_machine >> "$RUNNER_TEMP/test.log" 2>&1 || status=1
          cat "$RUNNER_TEMP/test.log"
          # One note per failed test with the start of its output.
          python3 - "$RUNNER_TEMP/test.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], errors="replace").read()
          for name, body in re.findall(r"^---- (\S+) stdout ----\n(.*?)(?=^---- |^failures:|\Z)", text, re.M | re.S)[:20]:
              lines = [l for l in body.splitlines() if l.strip()][:15]
              msg = "%0A".join(l.replace("%", "%25") for l in lines)[:3000]
              print(f"::error title={name}::{msg}")
          # Tests that re-run themselves print their own panic outside those blocks.
          seen = set()
          lines = text.splitlines()
          for i, l in enumerate(lines):
              if "panicked at" in l and l not in seen and len(seen) < 10:
                  seen.add(l)
                  msg = "%0A".join(x.replace("%", "%25") for x in lines[i:i + 3])[:3000]
                  print(f"::error title=panic::{msg}")
          PY
          exit $status

  ui:
    name: Web UI (types, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/tessera/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tessera/ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run -s typecheck
      - run: npm run build
      # THIRD_PARTY_LICENSES.txt and THIRD_PARTY_NOTICES.md follow the lockfiles.
      - name: Third-party licences are up to date
        run: node ../../../scripts/licenses.mjs --check

  installer:
    name: Installer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The source install builds the web UI, which needs Node 22.12 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/release-links.mjs --check
      - run: sh scripts/test-first-run.sh
      - run: shellcheck -S warning scripts/install.sh scripts/test-install.sh scripts/first-run.sh scripts/test-first-run.sh scripts/release-gitea.sh
      # A throwaway home: from the source tree, piped with a ready-made build,
      # a bad checksum, and the fallback to the source.
      - run: sh scripts/test-install.sh
