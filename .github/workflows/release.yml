# A launch release is published only after all Linux, Windows and Android
# artifacts pass scripts/check-release.py. macOS builds are additional downloads.
#
# Run it by hand (Actions → Release → Run workflow) to build an existing tag
# again; files already on the release are replaced.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  # The Linux builds run on glibc 2.28 and newer (Debian 10, Ubuntu 20.04,
  # RHEL 8 and later). scripts/install.sh has the same floor (GLIBC_MIN).
  GLIBC: "2.28"

jobs:
  check:
    name: The tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Compare
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "Cargo.toml: $version · tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-links.mjs --check
      - run: python3 scripts/test-check-release.py

  cli:
    name: tessera ${{ matrix.asset }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { asset: linux-aarch64, os: ubuntu-24.04, target: aarch64-unknown-linux-gnu }
          - { asset: macos-aarch64, os: macos-14, target: aarch64-apple-darwin, optional: true }
          - { asset: macos-x86_64, os: macos-14, target: x86_64-apple-darwin, optional: true }
    runs-on: ${{ matrix.os }}
    # The macOS builds are new: one failing doesn't hold up the release (the
    # installer builds from source where there is no ready-made build).
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Zig (builds for an older glibc, and for aarch64)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface for the embedded browser app
        working-directory: apps/tessera/ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build
        shell: bash
        run: |
          export TESSERA_WEB_APP="$GITHUB_WORKSPACE/apps/tessera/ui/dist"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --locked -p tessera --target "${{ matrix.target }}.$GLIBC"
          else
            cargo build --release --locked -p tessera --target "${{ matrix.target }}"
          fi
      - name: It runs
        if: matrix.asset == 'linux-x86_64' || matrix.asset == 'macos-aarch64'
        run: target/${{ matrix.target }}/release/tessera --version
      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp "target/${{ matrix.target }}/release/tessera" pkg/
          for f in LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt; do if [ -f "$f" ]; then cp "$f" pkg/; fi; done
          (cd pkg && tar -czf "../tessera-${{ matrix.asset }}.tar.gz" *)
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.asset }}
          path: tessera-${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  desktop:
    name: desktop app linux-x86_64
    needs: check
    # Built on the oldest supported Ubuntu, so it runs on newer systems too
    # (it needs WebKitGTK 4.1 there; the installer checks and offers it).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface
        working-directory: apps/tessera/ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Desktop app
        run: |
          # The same exact version as scripts/install.sh (TAURI_CLI).
          cargo install tauri-cli --version "$(sed -n 's/^TAURI_CLI=//p' scripts/install.sh)" --locked
          cd apps/tessera/src-tauri && cargo tauri build --no-bundle -- --locked
      - name: Package
        run: |
          mkdir -p pkg/icons
          cp target/release/tessera-app pkg/tessera-desktop
          cp apps/tessera/src-tauri/icons/128x128@2x.png pkg/icons/256x256.png
          cp apps/tessera/src-tauri/icons/32x32.png pkg/icons/32x32.png
          for f in LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt; do if [ -f "$f" ]; then cp "$f" pkg/; fi; done
          (cd pkg && tar -czf ../tessera-desktop-linux-x86_64.tar.gz *)
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-desktop-linux-x86_64
          path: tessera-desktop-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: tessera windows-x86_64 (and the desktop app)
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server, helpers and complete desktop installer
        shell: pwsh
        run: ./scripts/release-windows.ps1
      - name: It runs
        run: target/x86_64-pc-windows-msvc/release/tessera.exe --version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/tessera.exe, target/x86_64-pc-windows-msvc/release/tessera-service.exe, scripts/install.ps1 pkg/
          foreach ($f in 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.txt') { if (Test-Path $f) { Copy-Item $f pkg/ } }
          Compress-Archive -Path pkg/* -DestinationPath tessera-windows-x86_64.zip
          Copy-Item out/tessera-desktop-windows-x86_64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-windows-x86_64
          path: |
            tessera-windows-x86_64.zip
            tessera-desktop-windows-x86_64-setup.exe
          if-no-files-found: error

  android:
    name: Signed Android ARM64 APK
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The public release signing identity
        id: key
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            # The release goes out without the Android app; unsigned/debug APKs are never published.
            echo '::warning::No Android release signing key (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS): this release has no Android app.'
            echo signed=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo signed=true >> "$GITHUB_OUTPUT"
          umask 077
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/tessera-release.jks"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/tessera-release.pass"
      - uses: actions/setup-node@v4
        if: steps.key.outputs.signed == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.key.outputs.signed == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        if: steps.key.outputs.signed == 'true'
      - name: Android SDK and Rust
        if: steps.key.outputs.signed == 'true'
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;29.0.13846066'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install tauri-cli --version "$(sed -n 's/^TAURI_CLI=//p' scripts/install.sh)" --locked
      - name: Generate ignored Tauri Gradle and ProGuard files
        if: steps.key.outputs.signed == 'true'
        working-directory: apps/tessera/src-tauri
        run: |
          # Generate into an empty directory, then restore all our checked-in
          # Android customizations, including SDK levels and MainActivity.
          mv gen/android "$RUNNER_TEMP/android-custom"
          cargo tauri android init --ci
          cp -a "$RUNNER_TEMP/android-custom/." gen/android/
      - name: Build with vendor patch guards and sign for release
        if: steps.key.outputs.signed == 'true'
        env:
          RUST_MIN_STACK: '134217728'
          TESSERA_ANDROID_PUBLIC_RELEASE: '1'
          TESSERA_ANDROID_BUILD: ${{ runner.temp }}/android-build
          TESSERA_KEYSTORE: ${{ runner.temp }}/tessera-release.jks
          TESSERA_KEYSTORE_PASS_FILE: ${{ runner.temp }}/tessera-release.pass
          TESSERA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sh scripts/android.sh release aarch64
          cp out/tessera-universal-release-aarch64.apk tessera-android-arm64.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tessera-release.jks" "$RUNNER_TEMP/tessera-release.pass"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: tessera-android-arm64
          path: tessera-android-arm64.apk
          if-no-files-found: error
  publish:
    name: Publish the release
    needs: [check, cli, desktop, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - uses: android-actions/setup-android@v3
      - name: Android inspection tools
        run: |
          sdkmanager 'build-tools;37.0.0'
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Installer and checksums
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Require the whole launch release
        env:
          TESSERA_RELEASE_ANDROID: ${{ needs.android.outputs.signed }}
        run: python3 scripts/check-release.py dist
      # Anyone can check where a file came from: gh attestation verify <file> --repo <owner/repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID: ${{ needs.android.outputs.signed }}
        run: |
          notes=.github/release-notes.md
          if [ "$ANDROID" != "true" ]; then
            { printf '%s\n\n' '> The Android app is not in this release yet: its release signing key is not set up. Build it from source (scripts/android.sh) or check back later.'; cat .github/release-notes.md; } > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Tessera $TAG" --notes-file "$notes" $pre
          fi
