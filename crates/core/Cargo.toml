[package]
name = "tessera-core"
description = "Tessera agent engine: sessions, agent loop, providers, tools, context engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tessera-proto.workspace = true
tessera-secure.workspace = true
zeroize = "1"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
futures.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hmac = "0.12"
sha1 = "0.10"
# Desktop screenshots (node/screen.rs); already in the tree through the apps.
png = "0.18"
url.workspace = true
dirs.workspace = true
toml.workspace = true
regex.workspace = true
globset.workspace = true
ignore.workspace = true
time.workspace = true
# System TZif/Android tzdata; Windows alone bundles IANA rules (~200 KiB).
jiff = "0.2.37"
bytes = "1"
similar = "2"
# YAML syntax check after edits (parser only; MIT OR Apache-2.0).
saphyr-parser = "0.1"

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile = "3"
axum.workspace = true
# Local HTTPS fixtures for the cloudflared redirect/download tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Paused clocks in tests of timeouts (`start_paused`).
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: process trees (Job Objects), stop events, file locks, the
# per-user sign-in list. Already in the tree through tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Services", "Win32_Security_Authorization", "Win32_UI_Shell"] }
