[package]
name = "tessera"
description = "Tessera: a lightweight, long-horizon AI agent harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-proto.workspace = true
tessera-core.workspace = true
tessera-server.workspace = true
tessera-client.workspace = true
tessera-secure.workspace = true
zeroize = "1"
qrcode = { version = "0.14", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tokio-util.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ratatui.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
dirs.workspace = true
base64.workspace = true
# The watchdog asks it which locks are deadlocked (src/watchdog.rs).
parking_lot.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
