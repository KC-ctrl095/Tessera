[package]
name = "tessera-startup-tests"
version = "0.0.0"
edition = "2024"
publish = false

# Actual app config, credential sequencing and profile ownership paths,
# alongside cli_run/start_job. No Tauri/GTK, server or model is started.
[dev-dependencies]
semver = "1"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tessera-client = { path = "../../../../crates/client" }
tessera-proto = { path = "../../../../crates/proto" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(desktop)', 'cfg(mobile)'] }

[workspace]
